[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rent-airbnb"
version = "0.1.0"
description = "Medallion pipeline: Amsterdam Airbnb vs Kamernet investment comparison"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.4",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
databricks = [
    "databricks-sdk>=0.20",
]

[project.scripts]
bronze_job = "rent_airbnb.jobs:bronze_job"
silver_job = "rent_airbnb.jobs:silver_job"
gold_job = "rent_airbnb.jobs:gold_job"
pipeline_job = "rent_airbnb.jobs:pipeline_job"
streaming_job = "rent_airbnb.jobs:streaming_job"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
