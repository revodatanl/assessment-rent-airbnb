# Medallion batch job — wheel tasks (bronze → silver → gold)

resources:
  jobs:
    rent_airbnb_pipeline:
      name: rent-airbnb-medallion-pipeline
      description: >
        End-to-end medallion pipeline comparing Amsterdam Airbnb vs Kamernet
        rental revenue by postal code.

      tasks:
        - task_key: bronze
          description: Ingest raw CSV and JSON into Bronze Parquet
          python_wheel_task:
            package_name: rent_airbnb
            entry_point: bronze_job
            parameters:
              - "--airbnb-csv=${var.airbnb_csv}"
              - "--rentals-json=${var.rentals_json}"
              - "--output-base=${var.output_base}"
          libraries:
            - whl: ../dist/*.whl
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            spark_conf:
              spark.sql.shuffle.partitions: "8"

        - task_key: silver
          depends_on:
            - task_key: bronze
          description: Clean, type-cast, and geo-enrich Bronze → Silver
          python_wheel_task:
            package_name: rent_airbnb
            entry_point: silver_job
            parameters:
              - "--output-base=${var.output_base}"
              - "--post-codes-geojson=${var.post_codes_geojson}"
          libraries:
            - whl: ../dist/*.whl
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1

        - task_key: gold
          depends_on:
            - task_key: silver
          description: Revenue aggregation and investment comparison → Gold
          python_wheel_task:
            package_name: rent_airbnb
            entry_point: gold_job
            parameters:
              - "--output-base=${var.output_base}"
          libraries:
            - whl: ../dist/*.whl
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1

      email_notifications:
        on_failure:
          - ${ALERT_EMAIL}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Amsterdam"
